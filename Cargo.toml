[package]
name = "banking-studio"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
roxmltree = "0.21"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rust_xlsxwriter = "0.101.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
dotenvy = "0.15"
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
